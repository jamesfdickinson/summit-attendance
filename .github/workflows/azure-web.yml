name: Deploy C# site to Azure App Service

on:
  push:
    branches: [compare-3-versions]
    paths:
      - 'sites/SummitCheckIn.Web/**'
      - 'sites/SummitCheckIn.Web.Tests/**'
      - 'tests/**'
      - '.github/workflows/azure-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-web-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test backend
        run: dotnet run --project sites/SummitCheckIn.Web.Tests/SummitCheckIn.Web.Tests.csproj --configuration Release
      - name: Test frontend
        run: |
          node tests/pwa.test.js
          node tests/admin.test.js
      - name: Publish C# project
        run: dotnet publish sites/SummitCheckIn.Web/SummitCheckIn.Web.csproj --configuration Release --output ./publish
      - uses: actions/upload-artifact@v4
        with:
          name: azure-web
          path: publish/
          if-no-files-found: error

  deploy:
    needs: build
    if: github.ref == 'refs/heads/compare-3-versions' && vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: azure-web
          path: publish
      - name: Sign in to Azure with OpenID Connect
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy published site
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: publish
