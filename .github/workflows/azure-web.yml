name: Deploy site to Azure

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/azure-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-web-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and publish
        run: dotnet publish site/SummitCheckIn.Web.csproj --configuration Release --output ./publish
      - name: Deploy to summit-checkin
        uses: azure/webapps-deploy@v3
        with:
          app-name: summit-checkin
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
