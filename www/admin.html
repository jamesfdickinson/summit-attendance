<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#3f6087">
    <meta name="description" content="Summit Leadership Academy attendance reports">
    <title>Summit Attendance Reports</title>
    <link rel="icon" href="assets/icons/summit-192.png" sizes="192x192" type="image/png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="admin.css">
    <script src="config.js" defer></script>
    <script src="admin.js" defer></script>
  </head>
  <body>
    <main class="admin-page">
      <nav class="admin-topbar" aria-label="Admin navigation">
        <a class="secondary-button back-button" id="back-button" href="./">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.42-1.41L7.83 13H20v-2Z"/></svg>
          Back
        </a>
      </nav>

      <header class="admin-header">
        <img src="assets/logo.png" alt="Summit Leadership Academy">
        <div>
          <p class="eyebrow">Admin</p>
          <h1>Attendance reports</h1>
          <p id="report-date">Loading current attendance…</p>
        </div>
        <div class="admin-actions">
          <button class="secondary-button" id="refresh-button" type="button">Refresh</button>
        </div>
      </header>

      <div class="notice notice-error" id="admin-error" role="alert" hidden>
        <strong>We couldn't load the reports.</strong>
        <span id="admin-error-message">Please try again.</span>
      </div>

      <div class="admin-loading" id="admin-loading" role="status">
        <span class="spinner" aria-hidden="true"></span>
        <span>Loading attendance reports…</span>
      </div>

      <div id="report-content" hidden>
        <div class="report-tabs" role="tablist" aria-label="Attendance reports">
          <button class="report-tab" id="daily-tab" type="button" role="tab" aria-selected="true" aria-controls="daily-panel" tabindex="0">
            Today's attendance
          </button>
          <button class="report-tab" id="yearly-tab" type="button" role="tab" aria-selected="false" aria-controls="yearly-panel" tabindex="-1">
            Thursday attendance
          </button>
        </div>

        <section class="report-card report-tab-panel" id="daily-panel" role="tabpanel" aria-labelledby="daily-tab">
          <div class="report-heading">
            <div>
              <p class="eyebrow">Report one</p>
              <h2 id="daily-title">Today’s attendance</h2>
            </div>
            <span class="date-chip" id="daily-date"></span>
          </div>

          <div class="metric-grid">
            <div class="metric metric-wide">
              <div class="metric-line">
                <span>Families checked in</span>
                <strong id="family-percent">0%</strong>
              </div>
              <div class="progress-track" role="progressbar" id="daily-progress" aria-label="Families checked in today" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <span id="daily-progress-fill"></span>
              </div>
              <small id="family-count">0 of 0 families</small>
            </div>
            <div class="metric">
              <span>Members checked in</span>
              <strong id="member-count">0 / 0</strong>
            </div>
          </div>

          <div class="report-list" id="daily-list"></div>
        </section>

        <section class="report-card report-tab-panel" id="yearly-panel" role="tabpanel" aria-labelledby="yearly-tab" hidden>
          <div class="report-heading">
            <div>
              <p class="eyebrow">Report two</p>
              <h2 id="yearly-title">Thursday attendance</h2>
              <p id="yearly-description"></p>
            </div>
          </div>
          <div class="report-list" id="yearly-list"></div>
        </section>
      </div>
    </main>
  </body>
</html>
