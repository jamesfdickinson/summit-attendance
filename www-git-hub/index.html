<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#3f6087">
    <meta name="description" content="Continue to Summit Leadership Academy family check-in.">
    <meta http-equiv="refresh" content="3; url=https://checkin.jdsoftwarellc.com/">
    <link rel="canonical" href="https://checkin.jdsoftwarellc.com/">
    <link rel="icon" href="assets/summit-192.png" type="image/png">
    <title>Summit Leadership Check-In</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #26313d;
        background: #f4f6f8;
      }
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: 24px 16px;
        place-items: center;
      }
      main {
        width: min(100%, 460px);
        padding: clamp(24px, 6vw, 40px);
        border: 1px solid #e2e6ea;
        border-radius: 10px;
        background: #fff;
        box-shadow: 0 3px 16px rgb(30 48 67 / 8%);
        text-align: center;
      }
      .logo { display: block; width: min(100%, 290px); height: auto; margin: 0 auto 32px; }
      .eyebrow { margin: 0 0 10px; color: #3f6087; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(26px, 6vw, 32px); line-height: 1.2; }
      p { color: #687583; line-height: 1.6; }
      .button {
        display: block;
        margin-top: 26px;
        padding: 15px 20px;
        border-radius: 6px;
        background: #3f6087;
        color: #fff;
        font-weight: 700;
        line-height: 1.4;
        text-decoration: none;
      }
      .button:hover { background: #2d4c70; }
      .button:focus-visible { outline: 3px solid #3f91df; outline-offset: 4px; }
      .help { margin: 18px 0 0; font-size: 14px; }
      .address { display: block; overflow-wrap: anywhere; margin-top: 8px; font-size: 12px; color: #687583; }
    </style>
  </head>
  <body>
    <main aria-labelledby="page-title">
      <img class="logo" src="assets/logo.png" alt="Summit Leadership Academy">
      <p class="eyebrow">Daily attendance</p>
      <h1 id="page-title">Family check-in</h1>
      <p>We're taking you to our check-in site.</p>
      <a class="button" href="https://checkin.jdsoftwarellc.com/">Continue to check-in <span aria-hidden="true">&rarr;</span></a>
      <p class="help">If you aren't redirected automatically, use the button above.</p>
      <span class="address">checkin.jdsoftwarellc.com</span>
    </main>
  </body>
</html>
